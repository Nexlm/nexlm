openapi: 3.1.0
info:
  title: Nexlm API
  version: 1.0.0
  summary: Peer-to-peer XLM ↔ Naira exchange with on-chain Stellar escrow.
  description: |
    Every response is JSON. Errors share one shape:

    ```json
    { "error": { "code": "CONFLICT", "message": "Order already taken", "details": {} } }
    ```

    Clients branch on `code`, never on `message`. Every response carries an `X-Request-Id`
    header; quote it when reporting a problem.

    Amounts are decimal strings, never numbers: XLM to 7 places, Naira to 2. Parse them with a
    decimal library, not a float.
  license:
    name: See repository
    url: https://github.com/Nexlm/nexlm

servers:
  - url: https://nexlm-server.vercel.app
    description: Hosted testnet deployment
  - url: http://localhost:4000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: KYC
  - name: Wallet
  - name: Orders
  - name: Trades
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness, and optionally the database
      security: []
      parameters:
        - name: deep
          in: query
          description: Any value also checks that the database is reachable and migrated.
          schema: { type: string }
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [ok] }
                  version: { type: string, description: The build answering this request. }
                  network: { type: string, enum: [testnet, public] }
                  runtime: { type: string, enum: [server, serverless] }
                  realtime:
                    type: boolean
                    description: False when sockets are unavailable and the client must poll.
                  database: { type: string, enum: [ok, unreachable, 'migrations missing'] }
        '503':
          description: Degraded — the API is up but the database is not usable.

  /api/cron/tick:
    get:
      tags: [Health]
      summary: Run due background jobs (serverless deployments)
      description: 'Called by Vercel Cron. Requires the header `Authorization: Bearer $CRON_SECRET`.'
      responses:
        '200':
          description: Jobs ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ran:
                    type: object
                    properties:
                      expiredOrders: { type: integer }
                      autoCancelledTrades: { type: integer }
                      reconciledTrades: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/register:
    $ref: './paths/auth.yaml#/register'
  /api/auth/login:
    $ref: './paths/auth.yaml#/login'
  /api/auth/me:
    $ref: './paths/auth.yaml#/me'
  /api/auth/verify-email:
    $ref: './paths/auth.yaml#/verifyEmail'
  /api/auth/resend-verification:
    $ref: './paths/auth.yaml#/resendVerification'
  /api/auth/forgot-password:
    $ref: './paths/auth.yaml#/forgotPassword'
  /api/auth/reset-password:
    $ref: './paths/auth.yaml#/resetPassword'
  /api/auth/change-password:
    $ref: './paths/auth.yaml#/changePassword'

  /api/orders:
    get:
      $ref: './paths/orders.yaml#/list/get'
    post:
      $ref: './paths/orders.yaml#/create/post'
  /api/orders/mine:
    $ref: './paths/orders.yaml#/mine'
  /api/orders/{id}:
    $ref: './paths/orders.yaml#/byId'
  /api/orders/{id}/cancel:
    $ref: './paths/orders.yaml#/cancel'

  /api/trades:
    get:
      $ref: './paths/trades.yaml#/list/get'
    post:
      $ref: './paths/trades.yaml#/open/post'
  /api/trades/{id}:
    $ref: './paths/trades.yaml#/byId'
  /api/trades/{id}/paid:
    $ref: './paths/trades.yaml#/markPaid'
  /api/trades/{id}/release:
    $ref: './paths/trades.yaml#/release'
  /api/trades/{id}/cancel:
    $ref: './paths/trades.yaml#/cancel'
  /api/trades/{id}/messages:
    $ref: './paths/trades.yaml#/messages'

  /api/wallet:
    $ref: './paths/wallet.yaml#/summary'
  /api/wallet/deposit:
    $ref: './paths/wallet.yaml#/deposit'
  /api/wallet/activity:
    $ref: './paths/wallet.yaml#/activity'
  /api/wallet/transactions:
    $ref: './paths/wallet.yaml#/transactions'
  /api/wallet/withdraw:
    $ref: './paths/wallet.yaml#/withdraw'

  /api/users/me:
    $ref: './paths/users.yaml#/me'
  /api/users/me/payment-accounts:
    $ref: './paths/users.yaml#/paymentAccounts'
  /api/users/me/payment-accounts/{id}:
    $ref: './paths/users.yaml#/paymentAccountById'
  /api/users/{displayName}:
    $ref: './paths/users.yaml#/publicProfile'

  /api/kyc:
    $ref: './paths/users.yaml#/kyc'

  /api/admin/overview:
    $ref: './paths/admin.yaml#/overview'
  /api/admin/users:
    $ref: './paths/admin.yaml#/users'
  /api/admin/users/{id}:
    $ref: './paths/admin.yaml#/userById'
  /api/admin/users/{id}/status:
    $ref: './paths/admin.yaml#/userStatus'
  /api/admin/kyc/{id}:
    $ref: './paths/admin.yaml#/kycDecision'
  /api/admin/trades:
    $ref: './paths/admin.yaml#/trades'
  /api/admin/trades/{id}:
    $ref: './paths/admin.yaml#/tradeById'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Issued by /api/auth/login and /api/auth/register. Send as `Authorization: Bearer <token>`.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: Missing, expired or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed — includes `KYC_REQUIRED`, `EMAIL_NOT_VERIFIED` and `ACCOUNT_RESTRICTED`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation; `details` lists the offending fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests — `RATE_LIMITED`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The resource changed under you — refresh and retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, UNAUTHORIZED, KYC_REQUIRED, INSUFFICIENT_BALANCE, CONFLICT, STELLAR_TX_FAILED]
            message:
              type: string
              description: Safe to show a trader.
            details:
              description: Field errors for validation failures, or context for a business rule.
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      message: { type: string }
                - type: object

    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token:
          type: string
          description: JWT session token, valid for 7 days by default.

    User:
      type: object
      description: Never includes the password hash or the wallet seed.
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, enum: [USER, ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, BANNED] }
        emailVerified: { type: boolean }
        kycStatus: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED, REJECTED] }
        kycIdType: { type: string, enum: [BVN, NIN], nullable: true }
        kycIdLast4:
          type: string
          nullable: true
          description: Last four digits only — the full BVN/NIN is never stored.
        stellarPublicKey: { type: string, pattern: '^G[A-Z2-7]{55}$' }
        createdAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/TraderStats' }

    PublicUser:
      type: object
      description: What other traders see.
      properties:
        id: { type: string }
        displayName: { type: string }
        kycStatus: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED, REJECTED] }
        createdAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/TraderStats' }

    TraderStats:
      type: object
      properties:
        completedTrades: { type: integer }
        completionRate:
          type: number
          nullable: true
          description: Percentage with one decimal, or null for a trader with no closed trades.

    Pagination:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer }
        totalPages: { type: integer }
        hasMore: { type: boolean }

    XlmAmount:
      type: string
      pattern: '^\d+(\.\d{1,7})?$'
      examples: ['250', '0.0000001']
      description: XLM as a decimal string with up to 7 places.

    NgnAmount:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ['375000.00']
      description: Naira as a decimal string with 2 places.

    Order:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [BUY, SELL] }
        status: { type: string, enum: [ACTIVE, FILLED, CANCELLED, EXPIRED] }
        xlmAmount: { $ref: '#/components/schemas/XlmAmount' }
        ngnRate:
          allOf: [{ $ref: '#/components/schemas/NgnAmount' }]
          description: Naira per XLM.
        paymentMethods:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        terms: { type: string, nullable: true }
        expiresAt:
          type: string
          format: date-time
          description: Offers live for 30 minutes unless matched or cancelled.
        createdAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/PublicUser' }

    Trade:
      type: object
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TradeStatus' }
        role:
          type: string
          enum: [BUYER, SELLER]
          nullable: true
          description: Your side of this trade. Null for an admin viewing it.
        xlmAmount: { $ref: '#/components/schemas/XlmAmount' }
        ngnRate: { $ref: '#/components/schemas/NgnAmount' }
        ngnAmount:
          allOf: [{ $ref: '#/components/schemas/NgnAmount' }]
          description: The authoritative total, computed server-side.
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentDeadline: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason:
          type: string
          enum: [BUYER_CANCELLED, PAYMENT_TIMEOUT, ESCROW_FAILED]
          nullable: true
        escrowPublicKey:
          type: string
          nullable: true
          description: Written before the lock is submitted, so the funds are always traceable.
        createdAt: { type: string, format: date-time }
        buyer: { $ref: '#/components/schemas/PublicUser' }
        seller: { $ref: '#/components/schemas/PublicUser' }

    TradeDetails:
      allOf:
        - { $ref: '#/components/schemas/Trade' }
        - type: object
          properties:
            actions:
              type: array
              description: What you may do right now.
              items: { type: string, enum: [MARK_PAID, RELEASE, CANCEL] }
            paymentAccount:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/PaymentAccount' }]
              description: Where the buyer sends the Naira. Present while payment is due.
            secondsRemaining:
              type: integer
              description: Time left in the payment window; 0 once it is not running.
            links:
              type: object
              description: stellar.expert links for each on-chain step, null until it happens.
              properties:
                escrow: { type: string, nullable: true }
                release: { type: string, nullable: true }
                refund: { type: string, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string }
        tradeId: { type: string }
        senderId: { type: string, nullable: true, description: Null for system messages. }
        content: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, description: Payment proof. }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        sender:
          type: object
          nullable: true
          properties:
            id: { type: string }
            displayName: { type: string }

    PaymentAccount:
      type: object
      properties:
        id: { type: string }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        bankName: { type: string, nullable: true, description: Required for BANK_TRANSFER. }
        accountName: { type: string }
        accountNumber: { type: string, pattern: '^\d{10}$' }

    PaymentMethod:
      type: string
      enum: [BANK_TRANSFER, OPAY, PALMPAY, KUDA, MONIEPOINT]

    TradeStatus:
      type: string
      enum: [PENDING_ESCROW, ESCROW_LOCKED, PAID, RELEASING, REFUNDING, COMPLETED, CANCELLED]
