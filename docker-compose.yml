# Local development database.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexlm
    ports:
      - '5432:5432'
    volumes:
      - nexlm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexlm']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexlm-pg:
